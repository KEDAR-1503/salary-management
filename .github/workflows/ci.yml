name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: acme_salary_db
          POSTGRES_USER: acme_user
          POSTGRES_PASSWORD: acme_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U acme_user -d acme_salary_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      HR_MANAGER_USERNAME: hr_manager
      HR_MANAGER_PASSWORD: admin123
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/acme_salary_db
      SPRING_DATASOURCE_USERNAME: acme_user
      SPRING_DATASOURCE_PASSWORD: acme_password
      TESTCONTAINERS_RYUK_DISABLED: true
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Run backend tests
        run: cd backend && ./mvnw test -B

  frontend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install and test frontend
        run: |
          cd frontend
          npm ci
          npm test -- --no-watch --browsers=ChromeHeadlessNoSandbox

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t acme-salary-management .

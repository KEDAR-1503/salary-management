spring.application.name=salarymgmt

# Trust X-Forwarded-* from Render/Neon reverse proxies (HTTPS cookies / redirects)
server.forward-headers-strategy=framework

# JPA / Flyway
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true

# HikariCP (free-tier budget)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=0

# Security credentials (override via env vars in production)
app.security.hr-manager.username=${HR_MANAGER_USERNAME:hr_manager}
app.security.hr-manager.password=${HR_MANAGER_PASSWORD:admin123}

# Seed batch settings
app.seed.batch-size=500

# Actuator
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
